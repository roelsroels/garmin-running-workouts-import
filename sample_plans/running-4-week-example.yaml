name: "Four-week running block example"

# Fictional example for a runner with an established 8 km long run and a goal of
# accumulating more controlled running near 10 km pace. Values are illustrative;
# generate targets from the individual runner's history and stated goal.
workouts:
  # Week 1 - introduce the goal-specific session
  - date: 2030-01-08
    sport: running
    name: "300108 Q 4x3"
    description: "15 min easy; 4 x 3 min at 6:00-6:10/km with 90 sec easy; 10 min easy"
    steps:
      - { type: warmup, duration: "15:00" }
      - repeat: 4
        steps:
          - { type: interval, duration: "3:00", pace: ["6:00", "6:10"] }
          - { type: recovery, duration: "1:30" }
      - { type: cooldown, duration: "10:00" }

  - date: 2030-01-10
    sport: running
    name: "300110 Easy35"
    description: "Thirty-five minutes easy; conversational effort, no pace target"
    steps:
      - { type: warmup, duration: "5:00" }
      - { type: interval, duration: "25:00" }
      - { type: cooldown, duration: "5:00" }

  - date: 2030-01-13
    sport: running
    name: "300113 Long080"
    description: "8 km easy; conversational effort"
    steps:
      - { type: interval, distance: "8km" }

  # Week 2 - repeat before progressing
  - date: 2030-01-15
    sport: running
    name: "300115 Q 4x3"
    description: "Repeat 4 x 3 min; aim for even execution at the same effort"
    steps:
      - { type: warmup, duration: "15:00" }
      - repeat: 4
        steps:
          - { type: interval, duration: "3:00", pace: ["6:00", "6:10"] }
          - { type: recovery, duration: "1:30" }
      - { type: cooldown, duration: "10:00" }

  - date: 2030-01-17
    sport: running
    name: "300117 Easy40"
    description: "Forty minutes easy; conversational effort"
    steps:
      - { type: warmup, duration: "5:00" }
      - { type: interval, duration: "30:00" }
      - { type: cooldown, duration: "5:00" }

  - date: 2030-01-20
    sport: running
    name: "300120 Long080"
    description: "Hold the long run at 8 km while the quality session is repeated"
    steps:
      - { type: interval, distance: "8km" }

  # Week 3 - extend accumulated goal-pace time if weeks 1-2 were controlled
  - date: 2030-01-22
    sport: running
    name: "300122 Q 3x5"
    description: "3 x 5 min at the same pace range; regress to 4 x 3 if prior execution was incomplete"
    steps:
      - { type: warmup, duration: "15:00" }
      - repeat: 3
        steps:
          - { type: interval, duration: "5:00", pace: ["6:00", "6:10"] }
          - { type: recovery, duration: "1:30" }
      - { type: cooldown, duration: "10:00" }

  - date: 2030-01-24
    sport: running
    name: "300124 Easy35"
    description: "Thirty-five minutes easy; conversational effort"
    steps:
      - { type: warmup, duration: "5:00" }
      - { type: interval, duration: "25:00" }
      - { type: cooldown, duration: "5:00" }

  - date: 2030-01-27
    sport: running
    name: "300127 Long080"
    description: "Hold the long run at 8 km while goal-pace duration changes"
    steps:
      - { type: interval, distance: "8km" }

  # Week 4 - recovery/consolidation
  - date: 2030-01-29
    sport: running
    name: "300129 Q 3x3"
    description: "Reduced quality volume; stay controlled"
    steps:
      - { type: warmup, duration: "15:00" }
      - repeat: 3
        steps:
          - { type: interval, duration: "3:00", pace: ["6:00", "6:10"] }
          - { type: recovery, duration: "1:30" }
      - { type: cooldown, duration: "10:00" }

  - date: 2030-01-31
    sport: running
    name: "300131 Easy30"
    description: "Thirty minutes easy; conversational effort"
    steps:
      - { type: warmup, duration: "5:00" }
      - { type: interval, duration: "20:00" }
      - { type: cooldown, duration: "5:00" }

  - date: 2030-02-03
    sport: running
    name: "300203 Long070"
    description: "Recovery-week long run: 7 km easy"
    steps:
      - { type: interval, distance: "7km" }
