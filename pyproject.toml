[project]
name = "garmin-running-workouts-import"
version = "0.3.0"
description = "Create, schedule, and manage running workouts in Garmin Connect"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "requests==2.33.1",
    "pyyaml==6.0.3",
    "cloudscraper==1.2.71",
    "python-dotenv==1.2.1",
]

[project.scripts]
garmin-workouts = "garminworkouts.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garminworkouts*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-httpserver==1.1.5",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-rA --cov=garminworkouts --cov-branch --cov-fail-under=50"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
