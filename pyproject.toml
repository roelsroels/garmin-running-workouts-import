[project]
name = "garmin-running-workouts-import"
version = "1.5.2"
description = "Assess activities and create, schedule, and manage running workouts in Garmin Connect"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyyaml==6.0.3",
    "python-dotenv==1.2.1",
    "garminconnect==0.3.8",
    "garmin-fit-sdk>=21.212.0",
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
]

[project.urls]
Changelog = "https://github.com/roelsroels/garmin-running-workouts-import/blob/main/CHANGELOG.md"
Documentation = "https://github.com/roelsroels/garmin-running-workouts-import#readme"
Issues = "https://github.com/roelsroels/garmin-running-workouts-import/issues"
Repository = "https://github.com/roelsroels/garmin-running-workouts-import"

[project.scripts]
garmin-workouts = "garminworkouts.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garminworkouts*"]

[tool.setuptools.package-data]
garminworkouts = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.uv]
# The repository launcher loads the source tree directly. Avoid editable .pth
# loaders, which can be disabled by hardened macOS development environments.
package = false

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-rA --cov=garminworkouts --cov-branch --cov-fail-under=50"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
